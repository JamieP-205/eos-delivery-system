name: Browser version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish browser/EosDelivery.Web/EosDelivery.Web.csproj -c Release -o out
      - name: Serve from /eos-delivery-system/browser/
        run: |
          mkdir -p site/browser
          cp -r out/wwwroot/. site/browser/
          sed -i 's|<base href="/" />|<base href="/eos-delivery-system/browser/" />|' site/browser/index.html
          touch site/.nojekyll
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=browser/"><title>EOS Delivery System</title><a href="browser/">Open the browser version</a>\n' > site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}browser/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
